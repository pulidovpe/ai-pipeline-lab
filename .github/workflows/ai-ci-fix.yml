name: AI CI Fix
on:
  check_run:
    types: [completed]

jobs:
  fix:
    if: |
      github.event.check_run.conclusion == 'failure' &&
      github.event.check_run.name == 'test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.check_run.check_suite.head_branch }}
          fetch-depth: 0

      - name: Obtener logs del CI fallido
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.event.check_run.details_url }} --log-failed > ci_failure.log 2>&1 || true
          # Alternativa si lo anterior falla:
          gh run list --workflow=ci.yml --limit=1 --json databaseId --jq '.[0].databaseId' > run_id.txt
          gh run view $(cat run_id.txt) --log-failed >> ci_failure.log 2>&1 || true
          cat ci_failure.log

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Analizar y fixear con IA
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install pytest -q
          LOGS=$(head -150 ci_failure.log)
          SRC=$(cat src/calculadora.py)
          PAYLOAD=$(jq -n --arg l "$LOGS" --arg s "$SRC" '{
            "messages":[{"role":"user","content":
              ("CI fallido. Logs:\n"+$l+"\n\nCodigo src/calculadora.py:\n"+$s+"\n\nResponde SOLO con codigo Python corregido. Sin explicaciones ni markdown.")
            }]
          }')
          FIX=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/run/@cf/meta/llama-3.3-70b-instruct-fp8-fast" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" | jq -r '.result.response')
          echo "=== FIX PROPOSAL ==="
          echo "$FIX"
          echo "$FIX" > fix_proposal.py
          if python -c "import ast; ast.parse(open('fix_proposal.py').read())" 2>/dev/null; then
            cp fix_proposal.py src/calculadora.py
            export PYTHONPATH=$PYTHONPATH:$(pwd)
            if pytest tests/ -q 2>/dev/null; then
              git config user.name 'ai-ci-bot'
              git config user.email 'ci@bot.local'
              git add src/calculadora.py
              git commit -m 'fix: auto-fix CI failure [skip ci]'
              git push
              echo "Fix aplicado"
            else
              echo "Fix no paso tests"
            fi
          else
            echo "Fix no es Python valido"
          fi
