name: AI CI Fix
on:
  workflow_run:
    workflows: ['CI Tests']
    types: [completed]
    branches:
      - 'feature/**'
      - main
  workflow_dispatch:

jobs:
  fix:
    if: github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Obtener logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} --log-failed > ci_failure.log 2>&1 || true
          cat ci_failure.log

      - name: Fix con IA
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install pytest -q
          LOGS=$(head -150 ci_failure.log)
          SRC=$(cat src/calculadora.py)
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          PAYLOAD=$(jq -n --arg l "$LOGS" --arg s "$SRC" '{
            "messages":[{"role":"user","content":
              ("Eres un asistente que solo responde con codigo Python puro.\nNUNCA uses markdown, NUNCA uses bloques de codigo, NUNCA escribas explicaciones.\nSolo escribe el codigo Python directamente.\n\nCI fallido. Logs:\n"+$l+"\n\nCodigo src/calculadora.py:\n"+$s+"\n\nEscribe el archivo corregido completo.")
            }]
          }')
          FIX=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/run/@cf/meta/llama-3.3-70b-instruct-fp8-fast" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" | jq -r '.result.response')
          echo "=== RAW FIX ==="
          echo "$FIX"
          CLEAN=$(echo "$FIX" | sed '/^```/d' | sed '/^#/d' | sed '/^Here/d' | sed '/^This/d' | sed '/^The/d' | sed '/^Note/d')
          echo "$CLEAN" > fix_proposal.py
          if python -c "import ast; ast.parse(open('fix_proposal.py').read())" 2>/dev/null; then
            cp fix_proposal.py src/calculadora.py
            export PYTHONPATH=$PYTHONPATH:$(pwd)
            if pytest tests/ -q 2>/dev/null; then
              git config user.name 'ai-ci-bot'
              git config user.email 'ci@bot.local'
              git add src/calculadora.py
              git commit -m 'fix: auto-fix CI failure [skip ci]'
              git push origin "HEAD:refs/heads/${BRANCH}"
              echo "Fix aplicado en rama $BRANCH"
            else
              echo "Fix no paso tests"
            fi
          else
            echo "Fix no es Python valido"
          fi
