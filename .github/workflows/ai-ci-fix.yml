name: AI CI Fix
on:
  workflow_run:
    workflows: ['CI Tests']
    types: [completed]
    branches:
      - 'feature/**'
      - main
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Debug conclusion
        run: |
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Event name: ${{ github.event_name }}"
