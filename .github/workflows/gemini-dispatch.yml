name: Gemini Dispatcher
on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  pull_request_review_comment:
    types: [created]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Responder con IA
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.pull_request != null }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            BODY=$(gh pr view "$ISSUE_NUMBER" --json body --jq '.body')
          else
            BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body')
          fi

          PAYLOAD=$(jq -n --arg text "$BODY" \
            '{"messages":[{"role":"user","content":$text}]}')

          RESPONSE=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/run/@cf/meta/llama-3.3-70b-instruct-fp8-fast" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            | jq -r '.result.response')

          gh issue comment "$ISSUE_NUMBER" --body "$RESPONSE"